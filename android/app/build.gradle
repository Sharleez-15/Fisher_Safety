plugins {
    id 'com.android.application'
}

def fisherUrl = providers.gradleProperty('fisherBaseUrl')
    .orElse('https://example.invalid/')
    .get()
if (!fisherUrl.startsWith('https://')) {
    throw new GradleException('fisherBaseUrl must use HTTPS; do not point the Android app at a cleartext URL.')
}

android {
    namespace 'org.fishersafety.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.fishersafety.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'FISHER_BASE_URL', '"' + fisherUrl.replace('\\','\\\\').replace('"','\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
